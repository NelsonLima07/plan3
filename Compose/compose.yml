name: plan3

services:
  backend:
    container_name: plan3-backend
    build:
      context: ../Backend
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://host.docker.internal:5432/plan3
      QUARKUS_DATASOURCE_USERNAME: admin
      QUARKUS_DATASOURCE_PASSWORD: jnelson3
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    networks:
      - plan3-net

  frontend:
    container_name: plan3-frontend
    build:
      context: ../Frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - plan3-net

networks:
  plan3-net:
    driver: bridge
